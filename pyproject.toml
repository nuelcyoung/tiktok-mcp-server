[project]
name = "tiktok-mcp-server"
version = "1.0.0"
description = "MCP server for TikTok data extraction, discovery, search, and transcription"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "tiktok", "playwright", "whisper"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]
dependencies = [
    "mcp[cli]>=2.2,<3",
    "playwright>=1.48",
    "pydantic>=2.8",
    "yt-dlp>=2024.10",
    "httpx>=0.27",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
# `uvx tiktok-mcp-server` runs the script named after the package.
tiktok-mcp-server = "tiktokmcp.server:main"
tiktok-mcp = "tiktokmcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiktokmcp"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
